[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "naver-bargain-alert"
version = "0.1.0"
description = "네이버 부동산 급매 주간 리포트 (Claude Routine 실행)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "respx>=0.21",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
"app.db" = ["migrations/*.py", "migrations/*.mako", "migrations/versions/*.py"]
"app.notify" = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
