# 명령행 사용 예: alembic upgrade head  (DB 경로는 .env의 DB_PATH, 기본 state/history.sqlite3)
# 새 마이그레이션: alembic revision --autogenerate -m "설명"
[alembic]
script_location = app/db/migrations
prepend_sys_path = .
# sqlalchemy.url 은 비워 둔다 -> env.py가 app.config 설정에서 읽는다.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
