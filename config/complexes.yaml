# 조사 대상 아파트 단지 목록
#
# 각 항목은 아래 중 하나로 적습니다.
#   - complex_no: 네이버 부동산 단지 번호 (주소창 .../complexes/3009 의 숫자)
#   - url: 네이버 부동산 단지 페이지 주소를 그대로 붙여넣기
# name은 알아보기 쉽게 적는 메모이고, 실제 단지명은 네이버에서 다시 읽어옵니다.
# molit_apt_seq는 국토부 실거래 단지 식별자입니다. 비워 두면 리포트에 "실거래 매칭 확인 필요"가 표시될 수 있습니다.

complexes:
  - complex_no: "3009"
    name: 잠원동아
  - complex_no: "22627"
    name: 잠실엘스
